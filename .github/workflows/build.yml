name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =====================================================
      # ENCONTRAR ZIP
      # =====================================================

      - name: Encontrar ZIP
        shell: bash
        run: |
          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"
          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"
          elif [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"
          else
            ZIP=$(find . -maxdepth 2 -type f \( -iname "Geo*Arvore*.zip" -o -iname "Geo*Árvore*.zip" \) | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      # =====================================================
      # EXTRAIR ZIP
      # =====================================================

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf temp_extract
          rm -rf project

          mkdir -p temp_extract
          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d temp_extract

          echo "Conteúdo extraído:"
          find temp_extract -maxdepth 5 -type f | sort

      # =====================================================
      # ENCONTRAR INDEX.HTML
      # =====================================================

      - name: Encontrar index.html
        shell: bash
        run: |
          INDEX=$(find temp_extract -type f -name "index.html" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "index.html encontrado em:"
          echo "$INDEX"

          SOURCE_DIR=$(dirname "$INDEX")

          echo "Pasta do projeto:"
          echo "$SOURCE_DIR"

          cp -r "$SOURCE_DIR"/. project/

      # =====================================================
      # PREPARAR WWW
      # =====================================================

      - name: Preparar arquivos Web
        working-directory: project
        shell: bash
        run: |
          rm -rf www
          mkdir -p www

          cp -r ./* www/ 2>/dev/null || true
          cp -r ./.[!.]* www/ 2>/dev/null || true

          rm -rf www/www
          rm -rf www/android
          rm -rf www/node_modules

          if [ ! -f "www/index.html" ]; then
            echo "ERRO: www/index.html não existe."
            exit 1
          fi

          echo "Arquivos em www:"
          find www -maxdepth 5 -type f | sort

      # =====================================================
      # CORRIGIR INDEX
      # =====================================================

      - name: Corrigir caminhos do index
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("www/index.html")

          content = path.read_text(encoding="utf-8")

          content = re.sub(
              r'<base\s+href\s*=\s*["\'][^"\']*["\']\s*/?>',
              '<base href="./">',
              content,
              flags=re.IGNORECASE
          )

          if not re.search(r'<base\s+href=', content, re.IGNORECASE):
              content = re.sub(
                  r'(<head[^>]*>)',
                  r'\1\n<base href="./">',
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

          content = re.sub(
              r'(\s(?:src|href)\s*=\s*["\'])/([^"\']+)',
              r'\1\2',
              content,
              flags=re.IGNORECASE
          )

          path.write_text(content, encoding="utf-8")

          print("index.html corrigido.")
          PY

      # =====================================================
      # PACKAGE.JSON
      # =====================================================

      - name: Preparar NPM
        working-directory: project
        shell: bash
        run: |
          if [ ! -f "package.json" ]; then
            cat > package.json <<'EOF'
          {
            "name": "geoarvore",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          fi

          cat package.json

      # =====================================================
      # INSTALAR NPM
      # =====================================================

      - name: Instalar dependências
        working-directory: project
        shell: bash
        run: |
          npm install

      # =====================================================
      # CONFIGURAR CAPACITOR
      # =====================================================

      - name: Configurar Capacitor
        working-directory: project
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.geoarvore.app",
            "appName": "GeoÁrvore",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      # =====================================================
      # CRIAR ANDROID
      # =====================================================

      - name: Criar Android
        working-directory: project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # =====================================================
      # SINCRONIZAR CAPACITOR
      # =====================================================

      - name: Sincronizar Capacitor
        working-directory: project
        shell: bash
        run: |
          npx cap sync android

      # =====================================================
      # VERIFICAR INDEX DENTRO DO ANDROID
      # =====================================================

      - name: Verificar arquivos Android
        working-directory: project
        shell: bash
        run: |
          echo "Procurando index.html dentro do Android..."

          find android/app/src/main/assets -type f | sort | head -100

          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERRO: index.html não chegou ao Android."
            exit 1
          fi

          echo "index.html encontrado no Android."

      # =====================================================
      # GPS
      # =====================================================

      - name: Configurar GPS
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'

              if permission not in text:
                  position = text.find(">")

                  text = (
                      text[:position + 1]
                      + "\n    "
                      + tag
                      + text[position + 1:]
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          path.write_text(text, encoding="utf-8")

          print("GPS configurado.")
          PY

      # =====================================================
      # ÍCONE
      # =====================================================

      - name: Configurar ícone
        working-directory: project
        shell: bash
        run: |
          ICON=""

          if [ -f "www/planta-cobra.png" ]; then
            ICON="www/planta-cobra.png"
          elif [ -f "planta-cobra.png" ]; then
            ICON="planta-cobra.png"
          fi

          if [ -n "$ICON" ]; then
            RES="android/app/src/main/res"

            mkdir -p "$RES/mipmap-mdpi"
            mkdir -p "$RES/mipmap-hdpi"
            mkdir -p "$RES/mipmap-xhdpi"
            mkdir -p "$RES/mipmap-xxhdpi"
            mkdir -p "$RES/mipmap-xxxhdpi"

            rm -rf "$RES/mipmap-anydpi-v26"

            for DIR in \
              mipmap-mdpi \
              mipmap-hdpi \
              mipmap-xhdpi \
              mipmap-xxhdpi \
              mipmap-xxxhdpi
            do
              cp "$ICON" "$RES/$DIR/ic_launcher.png"
              cp "$ICON" "$RES/$DIR/ic_launcher_round.png"
            done

            echo "Ícone aplicado."
          else
            echo "planta-cobra.png não encontrado."
          fi

      # =====================================================
      # MANIFEST
      # =====================================================

      - name: Configurar Manifest
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          path.write_text(text, encoding="utf-8")

          print("Manifest configurado.")
          PY

      # =====================================================
      # COMPILAR APK
      # =====================================================

      - name: Compilar APK
        working-directory: project/android
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug --no-daemon --stacktrace

      # =====================================================
      # VERIFICAR APK
      # =====================================================

      - name: Verificar APK
        shell: bash
        run: |
          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi criado."
            exit 1
          fi

          echo "APK criado:"
          ls -lh "$APK"

      # =====================================================
      # ENVIAR APK
      # =====================================================

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
