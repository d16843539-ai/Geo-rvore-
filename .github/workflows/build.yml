name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/
          ls -la www/

      - name: Build APK via Capacitor / Webview
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm init -y
          npx cap init GeoArvore com.geoarvores.app --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
