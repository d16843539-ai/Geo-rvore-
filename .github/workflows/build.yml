name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. BAIXAR REPOSITÓRIO
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 21
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # 3. NODE 22
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==================================================
      # 4. LOCALIZAR O ZIP NOVO
      # ==================================================

      - name: Find Project ZIP
        shell: bash
        run: |

          echo "Arquivos do repositório:"
          find . -maxdepth 2 -type f | sort

          echo ""

          ZIP=""

          if [ -f "GeoArvore_atualizado.zip" ]; then
              ZIP="GeoArvore_atualizado.zip"
          elif [ -f "GeoArvore_atualizado (1).zip" ]; then
              ZIP="GeoArvore_atualizado (1).zip"
          else
              ZIP=$(find . -maxdepth 1 -type f -iname "GeoArvore_atualizado*.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
              echo "ERRO: GeoArvore_atualizado.zip não encontrado!"
              exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==================================================
      # 5. EXTRAIR PROJETO
      # ==================================================

      - name: Extract Project
        shell: bash
        run: |

          rm -rf project

          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d project/

          echo ""
          echo "Projeto extraído."

          echo ""
          echo "Arquivos principais:"

          find project \
            -maxdepth 2 \
            -type f \
            \( \
              -name "package.json" \
              -o -name "capacitor.config.json" \
              -o -name "index.html" \
              -o -name "server.py" \
              -o -name "manifest.json" \
            \) \
            -print


      # ==================================================
      # 6. VERIFICAR PROJETO
      # ==================================================

      - name: Check Project
        shell: bash
        run: |

          echo "Verificando estrutura..."

          test -f project/package.json || {
            echo "ERRO: package.json não encontrado!"
            exit 1
          }

          test -f project/capacitor.config.json || {
            echo "ERRO: capacitor.config.json não encontrado!"
            exit 1
          }

          test -d project/android || {
            echo "ERRO: pasta android não encontrada!"
            exit 1
          }

          test -d project/www || {
            echo "ERRO: pasta www não encontrada!"
            exit 1
          }

          test -f project/www/index.html || {
            echo "ERRO: www/index.html não encontrado!"
            exit 1
          }

          echo "Projeto válido!"


      # ==================================================
      # 7. VERIFICAR PLANTA
      # ==================================================

      - name: Check Plant Icon
        shell: bash
        run: |

          if [ -f "project/www/planta-cobra.png" ]; then

              echo "Ícone encontrado em:"
              echo "project/www/planta-cobra.png"

          elif [ -f "project/planta-cobra.png" ]; then

              echo "Ícone encontrado na raiz."

              cp project/planta-cobra.png \
                 project/www/planta-cobra.png

          elif [ -f "planta-cobra.png" ]; then

              echo "Ícone encontrado no repositório."

              cp planta-cobra.png \
                 project/www/planta-cobra.png

          else

              echo "ERRO: planta-cobra.png não encontrada!"
              exit 1

          fi


      # ==================================================
      # 8. INSTALAR DEPENDÊNCIAS
      # ==================================================

      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          echo "Instalando dependências..."

          if [ -f "package-lock.json" ]; then

              npm ci --ignore-scripts

          else

              npm install --ignore-scripts

          fi


      # ==================================================
      # 9. SINCRONIZAR CAPACITOR
      # ==================================================

      - name: Sync Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap sync android


      # ==================================================
      # 10. CONFIGURAR ÍCONE DO APLICATIVO
      # ==================================================

      - name: Configure App Icon
        working-directory: project
        shell: bash
        run: |

          echo "Configurando ícone GeoÁrvore..."

          RES="android/app/src/main/res"

          # ----------------------------------------------
          # Remover configurações adaptativas antigas
          # ----------------------------------------------

          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          rm -f "$RES/drawable/ic_launcher_background.xml"
          rm -f "$RES/drawable/ic_launcher_foreground.png"

          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"

          # ----------------------------------------------
          # Criar pastas
          # ----------------------------------------------

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # ----------------------------------------------
          # Copiar planta para os ícones
          # ----------------------------------------------

          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # ----------------------------------------------
          # Ícones redondos
          # ----------------------------------------------

          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo ""
          echo "Ícone configurado!"


      # ==================================================
      # 11. CONFIGURAR MANIFEST
      # ==================================================

       - name: Configure Manifest
        working-directory: project
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # Ícones
          sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' "$MANIFEST"
          sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' "$MANIFEST"

          # Permissões necessárias
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || \
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

          echo "Manifest configurado com GPS."

          echo ""
          echo "Permissões encontradas:"
          grep 'uses-permission' "$MANIFEST" || true

      # ==================================================
      # 12. GARANTIR NOME DO APP
      # ==================================================

      - name: Configure App Name
        working-directory: project
        shell: bash
        run: |

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then

              sed -i \
                's|<string name="app_name">.*</string>|<string name="app_name">Geoárvore</string>|' \
                "$STRINGS"

          fi


      # ==================================================
      # 13. LIMPAR BUILD
      # ==================================================

      - name: Clean Android
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon


      # ==================================================
      # 14. COMPILAR APK
      # ==================================================

      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 15. VERIFICAR APK
      # ==================================================

      - name: Check APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

              echo "ERRO: APK não foi criado!"

              find project/android/app/build/outputs \
                -type f 2>/dev/null || true

              exit 1

          fi

          echo ""
          echo "=========================================="
          echo "       APK GERADO COM SUCESSO!"
          echo "=========================================="

          ls -lh "$APK"


      # ==================================================
      # 16. DISPONIBILIZAR APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
