name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/ || unzip -o "aplicativo (1).zip" -d www/

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android

      - name: Configure Name and Icons
        run: |
          # 1. Altera o nome no Android com suporte a diacríticos
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml

          # 2. Baixa a imagem diretamente da URL
          curl -k -L -A "Mozilla/5.0" -o icon.png "https://nutty-tan-2ykiogfy.edgeone.dev/"

          # 3. Copia a imagem baixada para todas as resoluções do Android
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

          # 4. Força o uso direto dos arquivos de imagem no AndroidManifest
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
