name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova Project
        run: |
          cordova create geoproject com.geoarvores.app GeoArvore
          unzip app.zip -d geoproject/www/
          cd geoproject
          cordova platform add android

      - name: Build Android APK
        run: |
          cd geoproject
          cordova build android --novr

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: GeoArvore-APK
          path: geoproject/platforms/android/app/build/outputs/apk/debug/app-debug.apk
