name: Build APK

on:
  push:
    branches:
      - main
      - master
      - principal

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. BAIXAR O CÓDIGO DO GITHUB
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. INSTALAR JAVA
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # 3. INSTALAR NODE.JS
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==================================================
      # 4. EXTRAIR O APP.ZIP
      # ==================================================

      - name: Extract App
        shell: bash
        run: |

          echo "Procurando app.zip..."

          if [ ! -f "app.zip" ]; then
            echo "ERRO: app.zip não encontrado."
            exit 1
          fi

          mkdir -p www

          unzip -o "app.zip" -d www/

          echo ""
          echo "Arquivos encontrados:"
          find www -maxdepth 2 -type f


      # ==================================================
      # 5. VERIFICAR O ÍCONE
      # ==================================================

      - name: Check Icon
        shell: bash
        run: |

          echo "Procurando planta-cobra.png..."

          if [ ! -f "www/planta-cobra.png" ]; then
            echo "ERRO: planta-cobra.png não encontrada dentro do app.zip."

            echo "Arquivos disponíveis:"
            find www -type f

            exit 1
          fi

          echo "Ícone encontrado!"

          file www/planta-cobra.png


      # ==================================================
      # 6. CRIAR PROJETO NODE
      # ==================================================

      - name: Initialize Node Project
        shell: bash
        run: |

          npm init -y


      # ==================================================
      # 7. INSTALAR CAPACITOR
      # ==================================================

      - name: Install Capacitor
        shell: bash
        run: |

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7


      # ==================================================
      # 8. CRIAR PROJETO CAPACITOR
      # ==================================================

      - name: Create Capacitor
        shell: bash
        run: |

          npx cap init \
            "Geoárvore" \
            "com.geoarvores.app" \
            --web-dir www


      # ==================================================
      # 9. ADICIONAR ANDROID
      # ==================================================

      - name: Add Android
        shell: bash
        run: |

          npx cap add android


      # ==================================================
      # 10. SINCRONIZAR CAPACITOR
      # ==================================================

      - name: Sync Capacitor
        shell: bash
        run: |

          npx cap sync android


      # ==================================================
      # 11. CORRIGIR CONFLITO DO KOTLIN
      # ==================================================

      - name: Fix Kotlin Dependencies
        shell: bash
        run: |

          echo "Corrigindo dependências Kotlin..."

          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }

                  resolutionStrategy.dependencySubstitution {
                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  }
              }
          }

          EOF

          echo "Kotlin corrigido."


      # ==================================================
      # 12. CONFIGURAR NOME DO APLICATIVO
      # ==================================================

      - name: Configure App Name
        shell: bash
        run: |

          if [ -f "android/app/src/main/res/values/strings.xml" ]; then

            sed -i \
              's|<string name="app_name">.*</string>|<string name="app_name">Geoárvore</string>|' \
              android/app/src/main/res/values/strings.xml

          fi


      # ==================================================
      # 13. CONFIGURAR ÍCONE
      # ==================================================

      - name: Configure App Icon
        shell: bash
        run: |

          echo "Configurando ícone Geoárvore..."

          # -----------------------------------------------
          # Pastas
          # -----------------------------------------------

          mkdir -p android/app/src/main/res/drawable

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26


          # -----------------------------------------------
          # Copiar planta para o foreground
          # -----------------------------------------------

          cp www/planta-cobra.png \
            android/app/src/main/res/drawable/ic_launcher_foreground.png


          # -----------------------------------------------
          # ÍCONES PARA DIFERENTES DENSIDADES
          # -----------------------------------------------

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


          # -----------------------------------------------
          # ÍCONES REDONDOS
          # -----------------------------------------------

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp www/planta-cobra.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


          # ==================================================
          # FUNDO BRANCO
          # ==================================================

          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <solid android:color="#FFFFFF"/>

          </shape>
          EOF


          # ==================================================
          # ÍCONE ADAPTATIVO ANDROID 8+
          # ==================================================

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background"/>

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground"/>

          </adaptive-icon>
          EOF


          # ==================================================
          # ÍCONE ADAPTATIVO REDONDO
          # ==================================================

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background"/>

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground"/>

          </adaptive-icon>
          EOF


          # ==================================================
          # 14. CONFIGURAR ANDROID MANIFEST
          # ==================================================

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            sed -i \
              's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' \
              "$MANIFEST"

            sed -i \
              's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' \
              "$MANIFEST"

          fi


          echo ""
          echo "================================"
          echo "Ícone configurado!"
          echo "================================"


      # ==================================================
      # 15. LIMPAR BUILD
      # ==================================================

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon


      # ==================================================
      # 16. COMPILAR APK
      # ==================================================

      - name: Build APK
        working-directory: android
        shell: bash
        run: |

          chmod +x gradlew
