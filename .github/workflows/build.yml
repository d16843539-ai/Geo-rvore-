name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1 - BAIXAR REPOSITÓRIO
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2 - JAVA
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =====================================================
      # 3 - NODE
      # =====================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =====================================================
      # 4 - ENCONTRAR GeoÁrvore.zip
      # =====================================================

      - name: Encontrar GeoÁrvore.zip
        shell: bash
        run: |

          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"

          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"

          else
            ZIP=$(find . -maxdepth 1 -type f \
              \( -iname "GeoÁrvore*.zip" -o -iname "GeoArvore*.zip" \) \
              | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: GeoÁrvore.zip não encontrado!"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =====================================================
      # 5 - EXTRAIR PROJETO
      # =====================================================

      - name: Extrair projeto
        shell: bash
        run: |

          rm -rf project

          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d project/

          echo ""
          echo "Projeto extraído."
          echo ""


      # =====================================================
      # 6 - VERIFICAR PROJETO
      # =====================================================

      - name: Verificar projeto
        shell: bash
        run: |

          echo "Verificando estrutura..."

          test -f project/package.json || {
            echo "ERRO: package.json não encontrado!"
            exit 1
          }

          test -d project/android || {
            echo "ERRO: pasta android não encontrada!"
            exit 1
          }

          test -d project/www || {
            echo "ERRO: pasta www não encontrada!"
            exit 1
          }

          test -f project/www/index.html || {
            echo "ERRO: www/index.html não encontrado!"
            exit 1
          }

          echo "Projeto encontrado!"


      # =====================================================
      # 7 - PEGAR PLANTA
      # =====================================================

      - name: Preparar planta-cobra.png
        shell: bash
        run: |

          echo "Procurando planta-cobra.png..."

          if [ -f "planta-cobra.png" ]; then

            cp planta-cobra.png \
              project/www/planta-cobra.png

          elif [ -f "project/planta-cobra.png" ]; then

            cp project/planta-cobra.png \
              project/www/planta-cobra.png

          elif [ -f "project/www/planta-cobra.png" ]; then

            echo "A planta já está em www."

          else

            echo "ERRO: planta-cobra.png não encontrada!"

            exit 1

          fi

          echo ""
          echo "Ícone encontrado:"
          file project/www/planta-cobra.png


      # =====================================================
      # 8 - INSTALAR DEPENDÊNCIAS
      # =====================================================

      - name: Instalar dependências
        working-directory: project
        shell: bash
        run: |

          if [ -f "package-lock.json" ]; then

            npm ci --ignore-scripts

          else

            npm install --ignore-scripts

          fi


      # =====================================================
      # 9 - SINCRONIZAR CAPACITOR
      # =====================================================

      - name: Sincronizar Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap sync android


      # =====================================================
      # 10 - FORÇAR ARQUIVOS DO WWW PARA O APK
      # =====================================================

      - name: Copiar aplicação Web para Android
        working-directory: project
        shell: bash
        run: |

          echo "Atualizando arquivos do aplicativo..."

          PUBLIC="android/app/src/main/assets/public"

          # Apagar conteúdo antigo
          rm -rf "$PUBLIC"

          # Criar novamente
          mkdir -p "$PUBLIC"

          # Copiar exatamente o conteúdo de www
          cp -R www/. "$PUBLIC/"

          echo ""
          echo "Arquivos copiados:"
          find "$PUBLIC" -maxdepth 2 -type f -printf '%p\n'

          echo ""
          echo "Tamanho do index.html:"

          wc -c "$PUBLIC/index.html"

          echo ""
          echo "Tamanho do index.html original:"

          wc -c www/index.html


      # =====================================================
      # 11 - CONFIGURAR ÍCONE
      # =====================================================

      - name: Configurar ícone
        working-directory: project
        shell: bash
        run: |

          RES="android/app/src/main/res"

          echo "Configurando ícone..."

          # Remover ícones adaptativos antigos
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Remover recursos antigos
          rm -f "$RES/drawable/ic_launcher_background.xml"
          rm -f "$RES/drawable/ic_launcher_foreground.png"
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"

          # Criar diretórios
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Ícone normal

          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Ícone redondo

          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Ícone configurado!"


      # =====================================================
      # 12 - CONFIGURAR MANIFEST
      # =====================================================

      - name: Configurar AndroidManifest
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # -------------------------------------------------
          # ÍCONE
          # -------------------------------------------------

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          # -------------------------------------------------
          # GPS
          # -------------------------------------------------

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]

          # Remover permissões antigas

          for permission in permissions:

              pattern = (
                  r'\s*'
                  + re.escape(permission)
              )

              text = re.sub(
                  pattern,
                  '',
                  text
              )

          # Inserir permissões depois da abertura do manifest

          marker = (
              '<manifest '
              'xmlns:android="http://schemas.android.com/apk/res/android">'
          )

          if marker not in text:

              raise SystemExit(
                  "ERRO: Manifest inválido!"
              )

          text = text.replace(
              marker,
              marker
              + "\n\n    "
              + "\n    ".join(permissions),
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Manifest configurado!")
          print("GPS configurado!")

          PY


      # =====================================================
      # 13 - CONFIGURAR NOME
      # =====================================================

      - name: Configurar nome do aplicativo
        working-directory: project
        shell: bash
        run: |

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then

            python3 <<'PY'

          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'<string name="title_activity_main">.*?</string>',
              '<string name="title_activity_main">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Nome configurado!")

          PY

          fi


      # =====================================================
      # 14 - CONFERIR A APLICAÇÃO
      # =====================================================

      - name: Conferir arquivos finais
        working-directory: project
        shell: bash
        run: |

          echo "=========================================="
          echo "ARQUIVOS WEB DENTRO DO APK"
          echo "=========================================="

          ls -lh android/app/src/main/assets/public/

          echo ""

          echo "index.html:"

          wc -c android/app/src/main/assets/public/index.html

          echo ""

          echo "planta-cobra.png:"

          ls -lh android/app/src/main/assets/public/planta-cobra.png

          echo ""

          echo "=========================================="
          echo "PERMISSÕES"
          echo "=========================================="

          grep "uses-permission" \
            android/app/src/main/AndroidManifest.xml


      # =====================================================
      # 15 - LIMPAR ANDROID
      # =====================================================

      - name: Limpar Android
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean --no-daemon


      # =====================================================
      # 16 - GERAR APK
      # =====================================================

      - name: Gerar APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =====================================================
      # 17 - VERIFICAR APK
      # =====================================================

      - name: Verificar APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não foi criado!"

            find project/android/app/build/outputs \
              -type f 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "       APK GERADO COM SUCESSO!"
          echo "=========================================="

          ls -lh "$APK"


      # =====================================================
      # 18 - DISPONIBILIZAR APK
      # =====================================================

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
