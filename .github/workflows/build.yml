name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR REPOSITÓRIO
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      # NÃO usar cache:npm porque o projeto pode não possuir
      # package-lock.json.
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 4. ENCONTRAR O ZIP
      # =========================================================
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"

          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"

          elif [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"

          else
            ZIP=$(find . -maxdepth 2 -type f \
              \( -iname "Geo*Árvore*.zip" -o -iname "Geo*Arvore*.zip" \) \
              | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do GeoÁrvore não encontrado!"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR ZIP
      # =========================================================
      - name: Extract Project
        shell: bash
        run: |

          rm -rf temp_extract
          rm -rf project

          mkdir -p temp_extract
          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d temp_extract

          echo ""
          echo "======================================"
          echo "CONTEÚDO DO ZIP"
          echo "======================================"

          find temp_extract -maxdepth 5 -type f | sort


      # =========================================================
      # 6. ENCONTRAR INDEX.HTML
      # =========================================================
      - name: Locate Web Project
        shell: bash
        run: |

          INDEX=$(find temp_extract \
            -type f \
            -name "index.html" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado dentro do ZIP!"
            exit 1
          fi

          echo "index.html encontrado:"
          echo "$INDEX"

          PROJECT_DIR=$(dirname "$INDEX")

          echo "Pasta do projeto:"
          echo "$PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. project/

          echo ""
          echo "======================================"
          echo "PROJETO COPIADO"
          echo "======================================"

          find project -maxdepth 4 -type f | sort


      # =========================================================
      # 7. PREPARAR WWW
      # =========================================================
      - name: Prepare WWW
        working-directory: project
        shell: bash
        run: |

          rm -rf www

          mkdir -p www

          echo "Copiando arquivos do site para www..."

          for item in * .[^.]*; do

            if [ "$item" = "www" ]; then
              continue
            fi

            if [ "$item" = "android" ]; then
              continue
            fi

            if [ "$item" = "node_modules" ]; then
              continue
            fi

            if [ -e "$item" ]; then
              cp -r "$item" www/
            fi

          done

          echo ""
          echo "======================================"
          echo "ARQUIVOS WWW"
          echo "======================================"

          find www -maxdepth 5 -type f | sort

          if [ ! -f "www/index.html" ]; then
            echo "ERRO: www/index.html não existe!"
            exit 1
          fi

          echo ""
          echo "www/index.html encontrado com sucesso."


      # =========================================================
      # 8. CORRIGIR INDEX.HTML
      # =========================================================
      - name: Fix Web Paths
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          index = Path("www/index.html")

          if not index.exists():
              raise SystemExit(
                  "ERRO: www/index.html não encontrado."
              )

          content = index.read_text(
              encoding="utf-8"
          )

          # -----------------------------------------------------
          # Corrigir BASE HREF
          # -----------------------------------------------------

          base_pattern = r'<base\s+href\s*=\s*["\'][^"\']*["\']\s*/?>'

          if re.search(
              base_pattern,
              content,
              flags=re.IGNORECASE
          ):

              content = re.sub(
                  base_pattern,
                  '<base href="./">',
                  content,
                  flags=re.IGNORECASE
              )

          else:

              head_pattern = r'(<head[^>]*>)'

              content = re.sub(
                  head_pattern,
                  r'\1\n<base href="./">',
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

          # -----------------------------------------------------
          # Corrigir caminhos absolutos
          # -----------------------------------------------------

          content = re.sub(
              r'(\s(?:src|href)\s*=\s*["\'])/([^"\']+)',
              r'\1\2',
              content,
              flags=re.IGNORECASE
          )

          index.write_text(
              content,
              encoding="utf-8"
          )

          print("index.html corrigido.")

          PY


      # =========================================================
      # 9. CRIAR/CORRIGIR CAPACITOR CONFIG
      # =========================================================
      - name: Configure Capacitor
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = Path("capacitor.config.json")

          if config.exists():

              try:

                  data = json.loads(
                      config.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  data = {}

          else:

              data = {}

          data["appId"] = data.get(
              "appId",
              "com.geoarvore.app"
          )

          data["appName"] = "GeoÁrvore"

          # MUITO IMPORTANTE:
          # Os arquivos do aplicativo estão em www/
          data["webDir"] = "www"

          config.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              config.read_text(
                  encoding="utf-8"
              )
          )

          PY


      # =========================================================
      # 10. GARANTIR PACKAGE.JSON
      # =========================================================
      - name: Prepare NPM
        working-directory: project
        shell: bash
        run: |

          if [ -f "package.json" ]; then

            echo "package.json encontrado."

          else

            echo "package.json não encontrado."
            echo "Criando package.json..."

            cat > package.json <<'EOF'
{
  "name": "geoarvore",
  "version": "1.0.0",
  "private": true,
  "dependencies": {
    "@capacitor/core": "^7.0.0",
    "@capacitor/android": "^7.0.0",
    "@capacitor/cli": "^7.0.0"
  }
}
EOF

          fi

          echo ""
          echo "======================================"
          echo "PACKAGE.JSON"
          echo "======================================"

          cat package.json


      # =========================================================
      # 11. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          if [ -f "package-lock.json" ]; then

            echo "package-lock.json encontrado."
            npm ci

          else

            echo "package-lock.json não encontrado."
            echo "Usando npm install."

            npm install

          fi


      # =========================================================
      # 12. VERIFICAR CAPACITOR
      # =========================================================
      - name: Check Capacitor
        working-directory: project
        shell: bash
        run: |

          echo "Versão do Capacitor:"

          npx cap --version

          echo ""
          echo "Conteúdo de www:"

          find www -maxdepth 4 -type f | sort

          echo ""

          if [ ! -f "www/index.html" ]; then
            echo "ERRO: index.html não existe!"
            exit 1
          fi


      # =========================================================
      # 13. CRIAR PROJETO ANDROID
      # =========================================================
      - name: Ensure Android
        working-directory: project
        shell: bash
        run: |

          if [ ! -d "android" ]; then

            echo "Projeto Android não encontrado."
            echo "Criando Android..."

            npx cap add android

          else

            echo "Projeto Android já existe."

          fi


      # =========================================================
      # 14. SINCRONIZAR CAPACITOR
      # =========================================================
      - name: Capacitor Sync
        working-directory: project
        shell: bash
        run: |

          echo "Sincronizando Capacitor..."

          npx cap sync android

          echo ""
          echo "Capacitor sincronizado."


      # =========================================================
      # 15. VERIFICAR SE OS ARQUIVOS CHEGARAM AO ANDROID
      # =========================================================
      - name: Verify Web Assets
        working-directory: project
        shell: bash
        run: |

          echo "======================================"
          echo "ARQUIVOS WEB NO ANDROID"
          echo "======================================"

          find android/app/src/main/assets \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -200

          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then

            echo ""
            echo "ERRO GRAVE:"
            echo "O index.html não chegou ao Android."
            echo "A compilação seria capaz de gerar APK,"
            echo "mas o aplicativo poderia abrir em branco."

            exit 1

          fi

          echo ""
          echo "index.html encontrado dentro do APK."


      # =========================================================
      # 16. CONFIGURAR GPS
      # =========================================================
      - name: Configure GPS
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():

              raise SystemExit(
                  "AndroidManifest.xml não encontrado."
              )

          text = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          for permission in permissions:

              pattern = (
                  r'<uses-permission\s+'
                  r'android:name="'
                  + re.escape(permission)
                  + r'"\s*/>'
              )

              if not re.search(pattern, text):

                  manifest_start = text.find(">")

                  tag = (
                      '\n    <uses-permission '
                      'android:name="'
                      + permission
                      + '" />'
                  )

                  text = (
                      text[:manifest_start + 1]
                      + tag
                      + text[manifest_start + 1:]
                  )

          # Permitir HTTP caso alguma parte do projeto utilize.
          if "android:usesCleartextTraffic" not in text:

              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Permissões de GPS configuradas."
          )

          PY


      # =========================================================
      # 17. CONFIGURAR ÍCONE
      # =========================================================
      - name: Configure App Icon
        working-directory: project
        shell: bash
        run: |

          ICON=""

          if [ -f "www/planta-cobra.png" ]; then

            ICON="www/planta-cobra.png"

          elif [ -f "planta-cobra.png" ]; then

            ICON="planta-cobra.png"

          else

            ICON=$(find . \
              -type f \
              -iname "planta-cobra.png" \
              -not -path "*/node_modules/*" \
              | head -n 1)

          fi

          if [ -z "$ICON" ]; then

            echo "AVISO:"
            echo "planta-cobra.png não encontrado."

          else

            echo "Ícone encontrado:"
            echo "$ICON"

            RES="android/app/src/main/res"

            mkdir -p "$RES/mipmap-mdpi"
            mkdir -p "$RES/mipmap-hdpi"
            mkdir -p "$RES/mipmap-xhdpi"
            mkdir -p "$RES/mipmap-xxhdpi"
            mkdir -p "$RES/mipmap-xxxhdpi"

            # Remover ícones adaptativos antigos
            rm -rf "$RES/mipmap-anydpi-v26"

            for folder in \
              mipmap-mdpi \
              mipmap-hdpi \
              mipmap-xhdpi \
              mipmap-xxhdpi \
              mipmap-xxxhdpi
            do

              cp "$ICON" \
                "$RES/$folder/ic_launcher.png"

              cp "$ICON" \
                "$RES/$folder/ic_launcher_round.png"

            done

            echo "Ícone aplicado."

          fi


      # =========================================================
      # 18. CONFIGURAR MANIFEST DO ÍCONE
      # =========================================================
      - name: Configure Manifest Icon
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("Ícone configurado no Manifest.")

          PY


      # =========================================================
      # 19. LIMPAR ANDROID
      # =========================================================
      - name: Clean Android
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean --no-daemon


      # =========================================================
      # 20. COMPILAR APK
      # =========================================================
      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 21. VERIFICAR APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não foi criado."

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"


      # =========================================================
      # 22. ENVIAR APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
