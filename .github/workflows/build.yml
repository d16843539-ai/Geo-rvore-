name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O REPOSITÓRIO
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 4. ENCONTRAR O ZIP
      # =========================================================
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"

          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"

          elif [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"

          else
            ZIP=$(find . -maxdepth 1 -type f \
              \( -iname "Geo*Árvore*.zip" -o -iname "Geo*Arvore*.zip" \) | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado!"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR E NORMALIZAR A ESTRUTURA DO PROJETO
      # =========================================================
      - name: Extract and Normalize Project
        shell: bash
        run: |

          rm -rf temp_extract project
          mkdir -p temp_extract project

          unzip -o "$PROJECT_ZIP" -d temp_extract/

          # Verificar se os arquivos estão dentro de uma subpasta (ex: temp_extract/GeoArvore/...)
          if [ ! -f "temp_extract/package.json" ] && [ ! -f "temp_extract/index.html" ]; then
            SUBDIR=$(find temp_extract -maxdepth 2 -name "package.json" -o -name "capacitor.config.json" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Movendo ficheiros do subdiretório: $SUBDIR"
              cp -r "$SUBDIR"/* project/
            fi
          else
            cp -r temp_extract/* project/
          fi

          rm -rf temp_extract


      # =========================================================
      # 6. CORRIGIR INDEX.HTML E ROTEAMENTO (EVITA TELA BRANCA)
      # =========================================================
      - name: Fix Web Assets and Base HREF
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          # Procurar index.html na raiz ou em www/
          index_files = list(Path(".").rglob("index.html"))

          for index_path in index_files:
              if "node_modules" in str(index_path) or "android" in str(index_path):
                  continue

              content = index_path.read_text(encoding="utf-8")

              # Ajustar base href para caminhos relativos no Android
              if '<base href="/"' in content or '<base href="/">' in content:
                  content = re.sub(r'<base\s+href="[^"]*"\s*/?>', '<base href="./" />', content)
              elif '<base' not in content:
                  content = content.replace('<head>', '<head>\n  <base href="./" />')

              # Remover / absolutos de scripts e css
              content = re.sub(r'src="/([^"]+)"', r'src="\1"', content)
              content = re.sub(r'href="/([^"]+)"', r'href="\1"', content)

              index_path.write_text(content, encoding="utf-8")
              print(f"Corrigido: {index_path}")
          PY


      # =========================================================
      # 7. AJUSTAR CAPACITOR CONFIG
      # =========================================================
      - name: Fix Capacitor Config
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'
          import json
          from pathlib import Path

          cfg_files = list(Path(".").rglob("capacitor.config.json"))

          for cfg_path in cfg_files:
              if "node_modules" in str(cfg_path):
                  continue

              try:
                  data = json.loads(cfg_path.read_text(encoding="utf-8"))
              except Exception:
                  data = {}

              data["webDir"] = "www"
              if "server" not in data:
                  data["server"] = {}

              data["server"]["androidScheme"] = "https"
              data["server"]["allowNavigation"] = ["*"]

              cfg_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
              print(f"Capacitor Config atualizado: {cfg_path}")
          PY


      # =========================================================
      # 8. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          if [ -f "package-lock.json" ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi


      # =========================================================
      # 9. SINCRONIZAR CAPACITOR
      # =========================================================
      - name: Sync Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap sync android || true


      # =========================================================
      # 10. FORÇAR APLICAÇÃO DO ÍCONE PLANTA-COBRA
      # =========================================================
      - name: Force Apply Plant Icon
        working-directory: project
        shell: bash
        run: |

          ICON_SOURCE=""

          if [ -f "www/planta-cobra.png" ]; then
            ICON_SOURCE="www/planta-cobra.png"
          elif [ -f "planta-cobra.png" ]; then
            ICON_SOURCE="planta-cobra.png"
          elif [ -f "../planta-cobra.png" ]; then
            ICON_SOURCE="../planta-cobra.png"
          fi

          if [ -n "$ICON_SOURCE" ]; then
            echo "A usar o ícone: $ICON_SOURCE"
            RES="android/app/src/main/res"

            # 1. Remover pastas de ícones adaptativos XML que sobrescrevem o PNG no Android 8+
            rm -rf "$RES/mipmap-anydpi-v26"
            rm -rf "$RES/mipmap-anydpi-v24"

            # 2. Criar pastas de alta densidade
            mkdir -p "$RES/mipmap-mdpi"
            mkdir -p "$RES/mipmap-hdpi"
            mkdir -p "$RES/mipmap-xhdpi"
            mkdir -p "$RES/mipmap-xxhdpi"
            mkdir -p "$RES/mipmap-xxxhdpi"

            # 3. Copiar sobre todos os launchers
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp "$ICON_SOURCE" "$RES/$folder/ic_launcher.png"
              cp "$ICON_SOURCE" "$RES/$folder/ic_launcher_round.png"
              cp "$ICON_SOURCE" "$RES/$folder/ic_launcher_foreground.png"
            done

            echo "Ícones substituídos com sucesso!"
          else
            echo "AVISO: Ícone planta-cobra.png não foi localizado."
          fi


      # =========================================================
      # 11. CONFIGURAR ANDROID MANIFEST (CLEARTEXT + GPS)
      # =========================================================
      - name: Configure Android Manifest
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")

              # Garantir suporte a tráfego local sem bloqueios
              if 'android:usesCleartextTraffic' not in text:
                  text = text.replace('<application', '<application android:usesCleartextTraffic="true"')

              # Apontar explicitamente para o PNG
              text = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', text)
              text = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)

              # Adicionar permissões
              permissions = [
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
              ]

              for p in ["INTERNET", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]:
                  text = re.sub(r'\s*<uses-permission android:name="android.permission.' + p + r'"\s*/>', '', text)

              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker in text:
                  text = text.replace(marker, marker + "\n\n" + "\n".join(permissions), 1)

              manifest.write_text(text, encoding="utf-8")
              print("AndroidManifest.xml atualizado!")
          PY


      # =========================================================
      # 12. LIMPAR E COMPILAR APK
      # =========================================================
      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace


      # =========================================================
      # 13. GERAR ARTIFACT
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

