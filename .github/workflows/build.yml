name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR REPOSITÓRIO
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      # =========================================================
      # 4. ENCONTRAR ZIP
      # =========================================================
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"

          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"

          elif [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"

          else
            ZIP=$(find . -maxdepth 2 -type f \
              \( -iname "Geo*Árvore*.zip" -o -iname "Geo*Arvore*.zip" \) \
              | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum ZIP do GeoÁrvore encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR ZIP
      # =========================================================
      - name: Extract Project
        shell: bash
        run: |

          rm -rf temp_extract
          rm -rf project

          mkdir -p temp_extract
          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d temp_extract

          echo ""
          echo "======================================"
          echo "CONTEÚDO EXTRAÍDO"
          echo "======================================"

          find temp_extract -maxdepth 4 -type f | sort


      # =========================================================
      # 6. LOCALIZAR A PASTA REAL DO PROJETO
      # =========================================================
      - name: Locate Web Project
        shell: bash
        run: |

          echo "Procurando index.html..."

          INDEX=$(find temp_extract \
            -type f \
            -name "index.html" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado dentro do ZIP."
            exit 1
          fi

          echo "index.html encontrado em:"
          echo "$INDEX"

          PROJECT_DIR=$(dirname "$INDEX")

          echo "Pasta web encontrada:"
          echo "$PROJECT_DIR"

          echo "WEB_SOURCE=$PROJECT_DIR" >> "$GITHUB_ENV"

          cp -r "$PROJECT_DIR"/. project/

          echo ""
          echo "======================================"
          echo "PROJETO COPIADO"
          echo "======================================"

          find project -maxdepth 3 -type f | sort


      # =========================================================
      # 7. PREPARAR WWW
      # =========================================================
      - name: Prepare WWW
        working-directory: project
        shell: bash
        run: |

          echo "Preparando pasta www..."

          rm -rf www
          mkdir -p www

          # Copiar todos os arquivos do site para www
          find . -maxdepth 1 -mindepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name "node_modules" \
            -exec cp -r {} www/ \;

          echo ""
          echo "======================================"
          echo "CONTEÚDO DE WWW"
          echo "======================================"

          find www -maxdepth 4 -type f | sort

          if [ ! -f "www/index.html" ]; then
            echo "ERRO: www/index.html não foi criado."
            exit 1
          fi

          echo "www/index.html encontrado!"


      # =========================================================
      # 8. CORRIGIR INDEX.HTML
      # =========================================================
      - name: Fix index.html
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          index = Path("www/index.html")

          if not index.exists():
              raise SystemExit("ERRO: www/index.html não existe.")

          content = index.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # BASE HREF
          # -----------------------------------------------------

          content = re.sub(
              r'<base\s+href\s*=\s*["\'][^"\']*["\']\s*/?>',
              '<base href="./">',
              content,
              flags=re.IGNORECASE
          )

          if not re.search(r'<base\s+href=', content, re.IGNORECASE):

              if re.search(r'<head[^>]*>', content, re.IGNORECASE):

                  content = re.sub(
                      r'(<head[^>]*>)',
                      r'\1\n<base href="./">',
                      content,
                      count=1,
                      flags=re.IGNORECASE
                  )

          # -----------------------------------------------------
          # CORRIGIR CAMINHOS ABSOLUTOS
          # -----------------------------------------------------

          content = re.sub(
              r'(\s(?:src|href)\s*=\s*["\'])/([^"\']+)',
              r'\1\2',
              content,
              flags=re.IGNORECASE
          )

          index.write_text(content, encoding="utf-8")

          print("index.html corrigido com sucesso.")

          PY


      # =========================================================
      # 9. GARANTIR CAPACITOR CONFIG
      # =========================================================
      - name: Configure Capacitor
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = Path("capacitor.config.json")

          if config.exists():

              try:
                  data = json.loads(
                      config.read_text(encoding="utf-8")
                  )
              except Exception:
                  data = {}

          else:
              data = {
                  "appId": "com.geoarvore.app",
                  "appName": "GeoÁrvore"
              }

          data["appName"] = "GeoÁrvore"
          data["webDir"] = "www"

          if "server" not in data:
              data["server"] = {}

          data["server"]["androidScheme"] = "https"

          config.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("capacitor.config.json:")
          print(config.read_text(encoding="utf-8"))

          PY


      # =========================================================
      # 10. VERIFICAR PACKAGE.JSON
      # =========================================================
      - name: Verify Package
        working-directory: project
        shell: bash
        run: |

          if [ ! -f "package.json" ]; then

            echo "package.json não encontrado."

            echo "Criando package.json..."

            cat > package.json <<'EOF'
          {
            "name": "geoarvore",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          fi

          cat package.json


      # =========================================================
      # 11. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi


      # =========================================================
      # 12. VERIFICAR CAPACITOR
      # =========================================================
      - name: Check Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap --version

          echo ""
          echo "Web directory:"
          ls -la www

          echo ""
          echo "Index:"
          ls -lh www/index.html


      # =========================================================
      # 13. CRIAR ANDROID SE NECESSÁRIO
      # =========================================================
      - name: Ensure Android
        working-directory: project
        shell: bash
        run: |

          if [ ! -d "android" ]; then

            echo "Pasta Android não encontrada."
            echo "Criando projeto Android..."

            npx cap add android

          else

            echo "Projeto Android já existe."

          fi


      # =========================================================
      # 14. SINCRONIZAR CAPACITOR
      # =========================================================
      - name: Capacitor Sync
        working-directory: project
        shell: bash
        run: |

          npx cap sync android


      # =========================================================
      # 15. GARANTIR PERMISSÕES GPS
      # =========================================================
      - name: Configure GPS
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml não encontrado."
              )

          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          for permission in permissions:

              tag = (
                  f'<uses-permission android:name="{permission}" />'
              )

              if permission not in text:

                  text = text.replace(
                      '<manifest',
                      '<manifest',
                      1
                  )

                  position = text.find(">")

                  text = (
                      text[:position + 1]
                      + "\n    "
                      + tag
                      + text[position + 1:]
                  )

          # Permitir conteúdo necessário ao WebView
          text = re.sub(
              r'\s+android:usesCleartextTraffic="[^"]*"',
              '',
              text
          )

          text = text.replace(
              '<application',
              '<application android:usesCleartextTraffic="true"',
              1
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("Permissões GPS configuradas.")

          PY


      # =========================================================
      # 16. CONFIGURAR ÍCONE
      # =========================================================
      - name: Configure App Icon
        working-directory: project
        shell: bash
        run: |

          ICON=""

          if [ -f "www/planta-cobra.png" ]; then
            ICON="www/planta-cobra.png"

          elif [ -f "planta-cobra.png" ]; then
            ICON="planta-cobra.png"

          else
            ICON=$(find . \
              -type f \
              -iname "planta-cobra.png" \
              | head -n 1)
          fi

          if [ -z "$ICON" ]; then

            echo "AVISO: planta-cobra.png não encontrado."

          else

            echo "Ícone encontrado: $ICON"

            RES="android/app/src/main/res"

            mkdir -p "$RES/mipmap-mdpi"
            mkdir -p "$RES/mipmap-hdpi"
            mkdir -p "$RES/mipmap-xhdpi"
            mkdir -p "$RES/mipmap-xxhdpi"
            mkdir -p "$RES/mipmap-xxxhdpi"

            rm -rf "$RES/mipmap-anydpi-v26"

            for folder in \
              mipmap-mdpi \
              mipmap-hdpi \
              mipmap-xhdpi \
              mipmap-xxhdpi \
              mipmap-xxxhdpi
            do

              cp "$ICON" \
                "$RES/$folder/ic_launcher.png"

              cp "$ICON" \
                "$RES/$folder/ic_launcher_round.png"

            done

            echo "Ícone aplicado."

          fi


      # =========================================================
      # 17. VERIFICAR ARQUIVOS FINAIS
      # =========================================================
      - name: Verify Android Assets
        working-directory: project
        shell: bash
        run: |

          echo "======================================"
          echo "WEB ASSETS"
          echo "======================================"

          find www -maxdepth 3 -type f | sort

          echo ""
          echo "======================================"
          echo "ANDROID ASSETS"
          echo "======================================"

          find android/app/src/main/res \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # =========================================================
      # 18. COMPILAR APK
      # =========================================================
      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 19. VERIFICAR APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não foi criado."
            exit 1

          fi

          echo "APK criado com sucesso:"
          ls -lh "$APK"


      # =========================================================
      # 20. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
