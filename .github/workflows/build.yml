name: Build APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. BAIXAR O CÓDIGO
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 2. INSTALAR JAVA
      # =========================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================
      # 3. PREPARAR SITE
      # =========================
      - name: Extract Web Assets
        run: |
          mkdir -p www

          if [ -f "app.zip" ]; then
            unzip -o app.zip -d www/
          elif [ -f "aplicativo (1).zip" ]; then
            unzip -o "aplicativo (1).zip" -d www/
          else
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi


      # =========================
      # 4. INSTALAR NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================
      # 5. CRIAR CAPACITOR
      # =========================
      - name: Create Capacitor Project
        run: |
          npm init -y

          npm install @capacitor/cli @capacitor/core @capacitor/android

          npx cap init "Geoárvore" com.geoarvores.app --web-dir www

          npx cap add android


      # =========================
      # 6. CONFIGURAR NOME DO APP
      # =========================
      - name: Configure App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/' \
          android/app/src/main/res/values/strings.xml

          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/' \
          android/app/src/main/res/values/strings.xml


      # =========================
      # 7. PREPARAR ÍCONE
      # =========================
      - name: Create App Icon
        run: |

          mkdir -p android/app/src/main/res/drawable

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26


          # ------------------------------------------------
          # BAIXAR O ÍCONE
          # ------------------------------------------------

          curl -L \
          -A "Mozilla/5.0" \
          -o icon.png \
          "https://nutty-tan-2ykiogfy.edgeone.dev/"


          # ------------------------------------------------
          # VERIFICAR SE É REALMENTE UMA IMAGEM
          # ------------------------------------------------

          file icon.png

          if ! file icon.png | grep -qiE "PNG|JPEG|WebP"; then
            echo "ERRO: O arquivo baixado não é uma imagem válida."
            exit 1
          fi


          # ------------------------------------------------
          # ÍCONE PARA ANDROID ANTIGO
          # ------------------------------------------------

          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


          # ------------------------------------------------
          # FOREGROUND DO ÍCONE ADAPTATIVO
          # ------------------------------------------------

          cp icon.png \
          android/app/src/main/res/drawable/ic_launcher_foreground.png


          # ------------------------------------------------
          # FUNDO BRANCO
          # ------------------------------------------------

          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <solid android:color="#FFFFFF"/>

          </shape>
          EOF


          # ------------------------------------------------
          # ÍCONE ADAPTATIVO
          # ANDROID 8+
          # ------------------------------------------------

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF


          # ------------------------------------------------
          # ÍCONE ADAPTATIVO REDONDO
          # ------------------------------------------------

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF


      # =========================
      # 8. GARANTIR QUE O MANIFEST
      # USE O ÍCONE
      # =========================
      - name: Configure Android Manifest
        run: |

          sed -i \
          's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/' \
          android/app/src/main/AndroidManifest.xml


      # =========================
      # 9. SINCRONIZAR CAPACITOR
      # =========================
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # =========================
      # 10. COMPILAR APK
      # =========================
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug


      # =========================
      # 11. DISPONIBILIZAR APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
