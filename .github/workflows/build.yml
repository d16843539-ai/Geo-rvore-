name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          mkdir -p www
          unzip -o app.zip -d www/

      - name: Build Webview APK
        uses: jasonmcfadden/static-to-apk@v1.1
        with:
          app-name: "GeoArvore"
          app-id: "com.geoarvores.app"
          web-dir: "www"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: "**/*.apk"
