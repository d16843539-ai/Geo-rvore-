name: Construir APK

on:
  push:
    branches:
      - principal
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # 3. NODE
      # ==========================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. VERIFICAR ARQUIVOS
      # ==========================================

      - name: Check Files
        shell: bash
        run: |

          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          echo ""

          if [ ! -f "app.zip" ]; then
            echo "ERRO: app.zip não encontrado!"
            exit 1
          fi

          if [ ! -f "planta-cobra.png" ]; then
            echo "ERRO: planta-cobra.png não encontrada!"
            exit 1
          fi

          echo "OK: app.zip encontrado."
          echo "OK: planta-cobra.png encontrado."


      # ==========================================
      # 5. EXTRAIR SITE
      # ==========================================

      - name: Extract App
        shell: bash
        run: |

          rm -rf www
          mkdir -p www

          unzip -o app.zip -d www/

          echo ""
          echo "Arquivos do aplicativo:"
          find www -type f | sort


      # ==========================================
      # 6. NPM
      # ==========================================

      - name: Initialize Node
        shell: bash
        run: |

          npm init -y


      # ==========================================
      # 7. CAPACITOR
      # ==========================================

      - name: Install Capacitor
        shell: bash
        run: |

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7


      # ==========================================
      # 8. CRIAR CAPACITOR
      # ==========================================

      - name: Create Capacitor
        shell: bash
        run: |

          npx cap init \
            "Geoárvore" \
            "com.geoarvores.app" \
            --web-dir www


      # ==========================================
      # 9. ANDROID
      # ==========================================

      - name: Add Android
        shell: bash
        run: |

          npx cap add android


      # ==========================================
      # 10. SINCRONIZAR
      # ==========================================

      - name: Sync Capacitor
        shell: bash
        run: |

          npx cap sync android


      # ==========================================
      # 11. CORRIGIR KOTLIN
      # ==========================================

      - name: Fix Kotlin
        shell: bash
        run: |

          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {

                  resolutionStrategy.eachDependency { details ->

                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }

                  }

                  resolutionStrategy.dependencySubstitution {

                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")

                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")

                  }
              }
          }

          EOF


      # ==========================================
      # 12. NOME DO APLICATIVO
      # ==========================================

      - name: Configure App Name
        shell: bash
        run: |

          FILE="android/app/src/main/res/values/strings.xml"

          if [ -f "$FILE" ]; then

            sed -i \
              's|<string name="app_name">.*</string>|<string name="app_name">Geoárvore</string>|' \
              "$FILE"

          fi


      # ==========================================
      # 13. CONFIGURAR ÍCONE
      # ==========================================

      - name: Configure Icon
        shell: bash
        run: |

          echo "Configurando ícone da planta..."

          # Remover possíveis ícones/XML antigos
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.png

          # Criar pastas
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Copiar a planta para todos os tamanhos
          cp planta-cobra.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Ícone redondo
          cp planta-cobra.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp planta-cobra.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Ícone configurado com sucesso."


      # ==========================================
      # 14. MANIFEST
      # ==========================================

      - name: Configure Manifest
        shell: bash
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            sed -i \
              's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' \
              "$MANIFEST"

            sed -i \
              's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' \
              "$MANIFEST"

          fi

          echo "Manifest configurado."


      # ==========================================
      # 15. LIMPAR GRADLE
      # ==========================================

      - name: Clean Gradle
        working-directory: android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon


      # ==========================================
      # 16. GERAR APK
      # ==========================================

      - name: Build APK
        working-directory: android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 17. VERIFICAR APK
      # ==========================================

      - name: Check APK
        shell: bash
        run: |

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não foi criado!"

            find android/app/build/outputs \
              -type f 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "       APK GERADO COM SUCESSO!"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================
      # 18. DISPONIBILIZAR APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
