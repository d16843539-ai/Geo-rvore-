name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/ || unzip -o "aplicativo (1).zip" -d www/

      - name: Build Android App with Custom Branding
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android
          
          # 1. Altera o nome exibido no Android
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml

          # 2. Copia e redimensiona a imagem para 1024x1024 (formato exigido pelo Capacitor)
          mkdir -p assets
          cp www/planta-cobra.png assets/icon.png 2>/dev/null || cp www/*.png assets/icon.png 2>/dev/null || true
          convert assets/icon.png -resize 1024x1024! assets/icon.png
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-foreground.png
          cp assets/icon.png assets/icon-background.png

          # 3. Gera os ícones e sincroniza com o projeto Android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
