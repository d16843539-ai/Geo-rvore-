name: Construir APK GeoÁrvore

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Procurar ZIP do aplicativo
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f \( \
            -iname "*.zip" \
            \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo ZIP encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair aplicativo
        shell: bash
        run: |
          set -e

          rm -rf temp_extract
          mkdir -p temp_extract

          unzip -o "$ZIP" -d temp_extract

          echo "Conteúdo extraído:"
          find temp_extract -maxdepth 4 -type f

      - name: Encontrar index.html
        shell: bash
        run: |
          set -e

          INDEX=$(find temp_extract -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "index.html encontrado em:"
          echo "$INDEX"

          ROOT=$(dirname "$INDEX")

          echo "Pasta do aplicativo:"
          echo "$ROOT"

          echo "APP_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Criar projeto Capacitor
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project
          mkdir -p project/www

          cp -R "$APP_ROOT"/. project/www/

          echo "Arquivos do aplicativo:"
          find project/www -maxdepth 3 -type f

      - name: Corrigir caminhos HTML
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path("project/www/index.html")

          if not html.exists():
              raise SystemExit("index.html não encontrado")

          text = html.read_text(encoding="utf-8")

          if "<base " not in text.lower():
              text = re.sub(
                  r"<head([^>]*)>",
                  r'<head\1><base href="./">',
                  text,
                  count=1,
                  flags=re.I
              )

          text = re.sub(
              r'((?:src|href)\s*=\s*["\'])/(?!/)',
              r'\1',
              text,
              flags=re.I
          )

          html.write_text(text, encoding="utf-8")

          print("HTML corrigido.")
          PY

      - name: Criar package.json
        shell: bash
        working-directory: project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "geoarvore",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

      - name: Instalar Capacitor
        working-directory: project
        run: npm install

      - name: Criar configuração Capacitor
        working-directory: project
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.geoarvore.app",
            "appName": "GeoÁrvore",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Criar Android
        working-directory: project
        run: |
          npx cap add android

      - name: Sincronizar Capacitor
        working-directory: project
        run: |
          npx cap sync android

      - name: Verificar arquivos Android
        working-directory: project
        run: |
          echo "Manifest antes das alterações:"
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "index.html:"
          ls -lh android/app/src/main/assets/public/index.html

      - name: Corrigir AndroidManifest
        working-directory: project
        shell: bash
        run: |
          set -e

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.getcapacitor.BridgeActivity"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "Manifest corrigido:"
          cat android/app/src/main/AndroidManifest.xml

      - name: Verificar XML do Manifest
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("AndroidManifest.xml válido.")
          except Exception as e:
              print("ERRO no AndroidManifest.xml:")
              print(e)
              raise
          PY

      - name: Copiar ícone
        working-directory: project
        shell: bash
        run: |
          ICON=""

          if [ -f "www/planta-cobra.png" ]; then
            ICON="www/planta-cobra.png"
          elif [ -f "www/planta-cobra.PNG" ]; then
            ICON="www/planta-cobra.PNG"
          fi

          if [ -n "$ICON" ]; then
            echo "Ícone encontrado: $ICON"

            mkdir -p android/app/src/main/res/drawable

            cp "$ICON" android/app/src/main/res/drawable/geoarvore_icon.png
          else
            echo "Ícone personalizado não encontrado."
          fi

      - name: Limpar projeto
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: Construir APK
        working-directory: project/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          find project/android -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
