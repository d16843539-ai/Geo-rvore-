name: Gerar APK GeoArvore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar aplicativo
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'GeoArvore*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: GeoArvore.zip não encontrado."
            exit 1
          fi

          rm -rf projeto app
          mkdir projeto
          mkdir app

          unzip -q "$ZIP" -d projeto

          mkdir -p app/www

          find projeto -mindepth 1 -maxdepth 1 \
            ! -name "android" \
            ! -name "www" \
            ! -name ".github" \
            -exec cp -R {} app/www/ \;

          if [ ! -s app/www/index.html ]; then
            echo "ERRO: index.html principal não encontrado."
            exit 1
          fi

          echo "index.html encontrado:"
          wc -c app/www/index.html

          cd app

          npm init -y

          npm install @capacitor/core @capacitor/android @capacitor/cli

          npx cap init GeoArvore com.geoarvore.app --web-dir www

          npx cap add android

          npx cap sync android

      - name: Configurar GPS
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

      - name: Configurar ícone
        run: |
          set -e

          if [ -f "projeto/planta-cobra.png" ]; then
            ICON="projeto/planta-cobra.png"
          elif [ -f "app/www/planta-cobra.png" ]; then
            ICON="app/www/planta-cobra.png"
          else
            echo "Ícone não encontrado. Continuando sem trocar o ícone."
            exit 0
          fi

          RES="app/android/app/src/main/res"

          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Compilar APK
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
