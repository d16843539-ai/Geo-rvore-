name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O REPOSITÓRIO
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 4. ENCONTRAR O ZIP
      # =========================================================
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          ZIP=""

          if [ -f "GeoÁrvore.zip" ]; then
            ZIP="GeoÁrvore.zip"

          elif [ -f "GeoArvore.zip" ]; then
            ZIP="GeoArvore.zip"

          elif [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"

          elif [ -f "GeoArvore_atualizado (1).zip" ]; then
            ZIP="GeoArvore_atualizado (1).zip"

          else
            ZIP=$(find . -maxdepth 1 -type f \
              \( -iname "Geo*Árvore*.zip" -o -iname "Geo*Arvore*.zip" \) | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado!"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR PROJETO
      # =========================================================
      - name: Extract Project
        shell: bash
        run: |

          rm -rf project

          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d project/

          echo ""
          echo "Projeto extraído."
          echo ""


      # =========================================================
      # 6. VERIFICAR E CORRIGIR ESTRUTURA E BASE HREF
      # =========================================================
      - name: Fix Web Assets and Base HREF
        working-directory: project
        shell: bash
        run: |

          echo "Ajustando index.html e caminhos para evitar tela branca..."

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          index_path = Path("www/index.html")

          if index_path.exists():
              content = index_path.read_text(encoding="utf-8")

              # 1. Corrigir base href
              if '<base href="/"' in content or '<base href="/">' in content:
                  content = re.sub(r'<base\s+href="[^"]*"\s*/?>', '<base href="./" />', content)
              elif '<base' not in content:
                  content = content.replace('<head>', '<head>\n  <base href="./" />')

              # 2. Corrigir barras iniciais em recursos src="/..." e href="/..."
              content = re.sub(r'src="/([^"]+)"', r'src="\1"', content)
              content = re.sub(r'href="/([^"]+)"', r'href="\1"', content)

              index_path.write_text(content, encoding="utf-8")
              print("index.html corrigido com sucesso!")
          else:
              print("AVISO: www/index.html não encontrado no caminho padrão.")
          PY


      # =========================================================
      # 7. VERIFICAR PLANTA
      # =========================================================
      - name: Check Plant Icon
        shell: bash
        run: |

          if [ -f "project/www/planta-cobra.png" ]; then

            echo "Ícone encontrado em project/www/"

          elif [ -f "project/planta-cobra.png" ]; then

            echo "Ícone encontrado na raiz do projeto."

            cp project/planta-cobra.png \
               project/www/planta-cobra.png

          elif [ -f "planta-cobra.png" ]; then

            echo "Ícone encontrado na raiz do repositório."

            cp planta-cobra.png \
               project/www/planta-cobra.png

          fi


      # =========================================================
      # 8. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          echo "Instalando dependências..."

          if [ -f "package-lock.json" ]; then

            npm ci --ignore-scripts

          else

            npm install --ignore-scripts

          fi


      # =========================================================
      # 9. CORRIGIR CAPACITOR CONFIG (SERVIDORES E ESQUEMA HTTP)
      # =========================================================
      - name: Fix Capacitor Config
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'
          import json
          from pathlib import Path

          cfg_path = Path("capacitor.config.json")
          if cfg_path.exists():
              try:
                  data = json.loads(cfg_path.read_text(encoding="utf-8"))
              except Exception:
                  data = {}

              data["webDir"] = "www"
              
              if "server" not in data:
                  data["server"] = {}

              data["server"]["androidScheme"] = "https"
              data["server"]["cleartext"] = True

              cfg_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
              print("capacitor.config.json atualizado com sucesso!")
          PY


      # =========================================================
      # 10. SINCRONIZAR CAPACITOR
      # =========================================================
      - name: Sync Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap sync android


      # =========================================================
      # 11. CONFIGURAR ÍCONE SEM DESTRUIR NATIVE RESOURCES
      # =========================================================
      - name: Configure App Icon
        working-directory: project
        shell: bash
        run: |

          echo "Configurando ícone GeoÁrvore..."

          RES="android/app/src/main/res"

          if [ -f "www/planta-cobra.png" ]; then
            mkdir -p "$RES/mipmap-mdpi"
            mkdir -p "$RES/mipmap-hdpi"
            mkdir -p "$RES/mipmap-xhdpi"
            mkdir -p "$RES/mipmap-xxhdpi"
            mkdir -p "$RES/mipmap-xxxhdpi"

            cp www/planta-cobra.png "$RES/mipmap-mdpi/ic_launcher.png"
            cp www/planta-cobra.png "$RES/mipmap-hdpi/ic_launcher.png"
            cp www/planta-cobra.png "$RES/mipmap-xhdpi/ic_launcher.png"
            cp www/planta-cobra.png "$RES/mipmap-xxhdpi/ic_launcher.png"
            cp www/planta-cobra.png "$RES/mipmap-xxxhdpi/ic_launcher.png"

            cp www/planta-cobra.png "$RES/mipmap-mdpi/ic_launcher_round.png"
            cp www/planta-cobra.png "$RES/mipmap-hdpi/ic_launcher_round.png"
            cp www/planta-cobra.png "$RES/mipmap-xhdpi/ic_launcher_round.png"
            cp www/planta-cobra.png "$RES/mipmap-xxhdpi/ic_launcher_round.png"
            cp www/planta-cobra.png "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

            echo "Ícone configurado com segurança!"
          fi


      # =========================================================
      # 12. CONFIGURAR ANDROID MANIFEST (CLEARTEXT + GPS + PERMISSÕES)
      # =========================================================
      - name: Configure Android Manifest
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          # Permitir tráfego HTTP/HTTPS local sem restrições (evita tela branca)
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"')

          # Inserir permissões de GPS e Internet
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]

          for p_name in ["INTERNET", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]:
              text = re.sub(r'\s*<uses-permission android:name="android.permission.' + p_name + r'"\s*/>', '', text)

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker in text:
              text = text.replace(marker, marker + "\n\n" + "\n".join(permissions), 1)

          manifest.write_text(text, encoding="utf-8")
          print("AndroidManifest.xml atualizado.")
          PY


      # =========================================================
      # 13. CONFIGURAR NOME DO APP
      # =========================================================
      - name: Configure App Name
        working-directory: project
        shell: bash
        run: |

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/strings.xml")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'<string name="title_activity_main">.*?</string>',
              '<string name="title_activity_main">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          path.write_text(text, encoding="utf-8")
          print("Nome Geoárvore configurado.")
          PY

          fi


      # =========================================================
      # 14. LIMPAR PROJETO ANDROID
      # =========================================================
      - name: Clean Android
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew
          ./gradlew clean --no-daemon


      # =========================================================
      # 15. GERAR APK
      # =========================================================
      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 16. VERIFICAR APK
      # =========================================================
      - name: Check APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi criado!"
            exit 1
          fi

          echo "APK gerado com sucesso!"


      # =========================================================
      # 17. DISPONIBILIZAR APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

