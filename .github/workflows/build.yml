name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/

      - name: Build Android App with Icon
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android
          
          # Copia a imagem planta-cobra.png para os assets do Capacitor
          mkdir -p assets
          cp www/planta-cobra.png assets/icon.png
          
          # Gera os ícones nativos do Android
          npx cap-assets generate --android
          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
