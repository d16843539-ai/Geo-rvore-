name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Unzip files
        run: unzip app.zip

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build APK
        run: |
          cordova create app com.geoarvores.app GeoArvore
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          cordova build android --novr

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: GeoArvore-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
