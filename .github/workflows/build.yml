name: Build APK

on:
  push:
    branches:
      - main
      - master
      - principal

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # BAIXAR O PROJETO
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # JAVA
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ==============================
      # NODE
      # ==============================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==============================
      # PREPARAR SITE
      # ==============================
      - name: Prepare Website
        shell: bash
        run: |

          mkdir -p www

          if [ -f "app.zip" ]; then
            unzip -o "app.zip" -d www/
          elif [ -f "aplicativo (1).zip" ]; then
            unzip -o "aplicativo (1).zip" -d www/
          else
            echo "ERRO: arquivo ZIP não encontrado."
            exit 1
          fi


      # ==============================
      # INSTALAR CAPACITOR
      # ==============================
      - name: Install Capacitor
        run: |

          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7


      # ==============================
      # CRIAR APLICATIVO
      # ==============================
      - name: Create Android Project
        run: |

          npx cap init "Geoárvore" "com.geoarvores.app" --web-dir www

          npx cap add android


      # ==============================
      # CORRIGIR KOTLIN
      # ==============================
      - name: Fix Kotlin Dependencies
        working-directory: android
        shell: bash
        run: |

          cat >> gradle.properties <<'EOF'

          # Corrigir conflitos de versões do Kotlin
          kotlin.stdlib.jdk.variants.version.alignment=true
          EOF


          # Forçar todas as bibliotecas Kotlin para a mesma versão
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }
          EOF


      # ==============================
      # ÍCONE
      # ==============================
      - name: Configure Icon
        shell: bash
        run: |

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi


          # Baixar ícone
          curl -L \
            -A "Mozilla/5.0" \
            -o icon.png \
            "https://nutty-tan-2ykiogfy.edgeone.dev/"


          # Verificar imagem
          file icon.png


          # Ícones normais
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


          # Foreground
          cp icon.png \
            android/app/src/main/res/drawable/ic_launcher_foreground.png


          # Fundo
          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <solid android:color="#FFFFFF"/>

          </shape>
          EOF


          # Ícone adaptativo
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background"/>

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground"/>

          </adaptive-icon>
          EOF


          # Ícone adaptativo redondo
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background"/>

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground"/>

          </adaptive-icon>
          EOF


      # ==============================
      # SINCRONIZAR
      # ==============================
      - name: Capacitor Sync
        run: |

          npx cap sync android


      # ==============================
      # LIMPAR BUILD ANTERIOR
      # ==============================
      - name: Clean
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean


      # ==============================
      # COMPILAR APK
      # ==============================
      - name: Build APK
        working-directory: android
        run: |

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==============================
      # ENVIAR APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
