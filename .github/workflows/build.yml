name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/ || unzip -o "aplicativo (1).zip" -d www/

      - name: Build Android App with Custom Branding
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android
          
          # 1. Altera o nome exibido no aplicativo
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml

          # 2. Script Python para redimensionar e substituir todos os ícones nativos do Android
          python3 -c "
          import os
          from PIL import Image

          icon_path = 'www/planta-cobra.png'
          if not os.path.exists(icon_path):
              for f in os.listdir('www'):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg')):
                      icon_path = os.path.join('www', f)
                      break

          img = Image.open(icon_path).convert('RGBA')
          res_path = 'android/app/src/main/res'
          
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in sizes.items():
              target_dir = os.path.join(res_path, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
          print('Ícones substituídos com sucesso!')
          "

          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
