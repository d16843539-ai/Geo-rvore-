name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/ || unzip -o "aplicativo (1).zip" -d www/

      - name: Build Android App with Custom Branding
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android
          
          # 1. Altera o nome exibido no aplicativo
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml

          # 2. APAGA o ícone adaptativo em XML padrão do Capacitor para forçar o uso do PNG
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 3. Localiza e copia a imagem para todas as resoluções de ícones
          ICON=$(find www -type f \( -iname "planta-cobra.png" -o -iname "*.png" \) | head -n 1)

          if [ -n "$ICON" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp "$ICON" "$dir/ic_launcher.png"
                cp "$ICON" "$dir/ic_launcher_round.png"
              fi
            done
          fi

          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
