name: Build APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Web Assets
        run: |
          mkdir -p www
          unzip -o app.zip -d www/ || unzip -o "aplicativo (1).zip" -d www/

      - name: Setup Capacitor and Build Android App
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          npx cap init "Geoárvore" com.geoarvores.app --web-dir www
          npx cap add android

          # 1. Altera o nome com acento no strings.xml
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Geoárvore<\/string>/g' android/app/src/main/res/values/strings.xml

          # 2. Baixa a imagem diretamente da URL para criar as 3 imagens base exigidas pelo Capacitor
          mkdir -p assets
          curl -L -o assets/icon-only.png "https://nutty-tan-2ykiogfy.edgeone.dev/"
          curl -L -o assets/icon-foreground.png "https://nutty-tan-2ykiogfy.edgeone.dev/"
          curl -L -o assets/icon-background.png "https://nutty-tan-2ykiogfy.edgeone.dev/"

          # 3. Gera todos os ícones adaptativos do Android nativamente
          npx capacitor-assets generate --android

          npx cap sync android

      - name: Build Android App with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
