name: Construir GeoÁrvore APK

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O REPOSITÓRIO
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 4. ENCONTRAR O ZIP
      # =========================================================
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "Arquivos encontrados:"
          find . -maxdepth 2 -type f | sort

          ZIP=""

          if [ -f "GeoArvore_atualizado.zip" ]; then
            ZIP="GeoArvore_atualizado.zip"

          elif [ -f "GeoArvore_atualizado (1).zip" ]; then
            ZIP="GeoArvore_atualizado (1).zip"

          else
            ZIP=$(find . -maxdepth 1 -type f \
              -iname "GeoArvore_atualizado*.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado!"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR PROJETO
      # =========================================================
      - name: Extract Project
        shell: bash
        run: |

          rm -rf project

          mkdir -p project

          unzip -o "$PROJECT_ZIP" -d project/

          echo ""
          echo "Projeto extraído."
          echo ""

          find project -maxdepth 2 -type f \
            \( -name "package.json" \
            -o -name "capacitor.config.json" \
            -o -name "index.html" \
            -o -name "server.py" \
            -o -name "manifest.json" \) \
            -print


      # =========================================================
      # 6. VERIFICAR PROJETO
      # =========================================================
      - name: Check Project
        shell: bash
        run: |

          echo "Verificando estrutura..."

          test -f project/package.json || {
            echo "ERRO: package.json não encontrado!"
            exit 1
          }

          test -f project/capacitor.config.json || {
            echo "ERRO: capacitor.config.json não encontrado!"
            exit 1
          }

          test -d project/android || {
            echo "ERRO: pasta android não encontrada!"
            exit 1
          }

          test -d project/www || {
            echo "ERRO: pasta www não encontrada!"
            exit 1
          }

          test -f project/www/index.html || {
            echo "ERRO: www/index.html não encontrado!"
            exit 1
          }

          echo "Projeto válido!"


      # =========================================================
      # 7. VERIFICAR PLANTA
      # =========================================================
      - name: Check Plant Icon
        shell: bash
        run: |

          if [ -f "project/www/planta-cobra.png" ]; then

            echo "Ícone encontrado em project/www/"

          elif [ -f "project/planta-cobra.png" ]; then

            echo "Ícone encontrado na raiz do projeto."

            cp project/planta-cobra.png \
               project/www/planta-cobra.png

          elif [ -f "planta-cobra.png" ]; then

            echo "Ícone encontrado na raiz do repositório."

            cp planta-cobra.png \
               project/www/planta-cobra.png

          else

            echo "ERRO: planta-cobra.png não encontrada!"

            exit 1

          fi

          file project/www/planta-cobra.png


      # =========================================================
      # 8. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Install Dependencies
        working-directory: project
        shell: bash
        run: |

          echo "Instalando dependências..."

          if [ -f "package-lock.json" ]; then

            npm ci --ignore-scripts

          else

            npm install --ignore-scripts

          fi


      # =========================================================
      # 9. SINCRONIZAR CAPACITOR
      # =========================================================
      - name: Sync Capacitor
        working-directory: project
        shell: bash
        run: |

          npx cap sync android


      # =========================================================
      # 10. CONFIGURAR ÍCONE
      # =========================================================
      - name: Configure App Icon
        working-directory: project
        shell: bash
        run: |

          echo "Configurando ícone GeoÁrvore..."

          RES="android/app/src/main/res"

          # Remover ícones adaptativos antigos
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Remover recursos antigos do Capacitor
          rm -f "$RES/drawable/ic_launcher_background.xml"
          rm -f "$RES/drawable/ic_launcher_foreground.png"
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"

          # Criar pastas
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Ícone principal
          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Ícone redondo
          cp www/planta-cobra.png \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp www/planta-cobra.png \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Ícone configurado!"


      # =========================================================
      # 11. CONFIGURAR ANDROID MANIFEST
      # =========================================================
      - name: Configure Android Manifest
        working-directory: project
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # ÍCONES
          # -----------------------------------------------------

          import re

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          # -----------------------------------------------------
          # PERMISSÕES DE INTERNET + GPS
          # -----------------------------------------------------

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]

          # Remover permissões antigas dessas três para evitar
          # duplicação
          text = re.sub(
              r'\s*<uses-permission android:name="android.permission.INTERNET"\s*/>',
              '',
              text
          )

          text = re.sub(
              r'\s*<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\s*/>',
              '',
              text
          )

          text = re.sub(
              r'\s*<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\s*/>',
              '',
              text
          )

          # Inserir permissões logo depois da abertura do manifest
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          if marker not in text:
              raise SystemExit(
                  "ERRO: abertura do AndroidManifest.xml não encontrada!"
              )

          text = text.replace(
              marker,
              marker + "\n\n" + "\n".join(permissions),
              1
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("AndroidManifest.xml configurado.")
          print()
          print("Permissões:")
          for p in permissions:
              print(p)

          PY


      # =========================================================
      # 12. MOSTRAR MANIFEST PARA CONFERÊNCIA
      # =========================================================
      - name: Verify GPS Configuration
        working-directory: project
        shell: bash
        run: |

          echo "=========================================="
          echo "ANDROID MANIFEST"
          echo "=========================================="

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=========================================="
          echo "VERIFICANDO GPS"
          echo "=========================================="

          grep "ACCESS_FINE_LOCATION" \
            android/app/src/main/AndroidManifest.xml

          grep "ACCESS_COARSE_LOCATION" \
            android/app/src/main/AndroidManifest.xml

          echo "GPS configurado corretamente!"


      # =========================================================
      # 13. NOME DO APP
      # =========================================================
      - name: Configure App Name
        working-directory: project
        shell: bash
        run: |

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then

            python3 <<'PY'

          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'<string name="title_activity_main">.*?</string>',
              '<string name="title_activity_main">Geoárvore</string>',
              text,
              flags=re.DOTALL
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Nome Geoárvore configurado.")

          PY

          fi


      # =========================================================
      # 14. LIMPAR PROJETO ANDROID
      # =========================================================
      - name: Clean Android
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean --no-daemon


      # =========================================================
      # 15. GERAR APK
      # =========================================================
      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 16. VERIFICAR APK
      # =========================================================
      - name: Check APK
        shell: bash
        run: |

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não foi criado!"

            find project/android/app/build/outputs \
              -type f 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "       APK GERADO COM SUCESSO!"
          echo "=========================================="

          ls -lh "$APK"


      # =========================================================
      # 17. DISPONIBILIZAR APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geoarvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
