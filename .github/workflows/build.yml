name: Construir APK GeoÁrvore

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O REPOSITÓRIO
      # =========================================================
      - name: Baixar código
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 4. ENCONTRAR O ZIP
      # =========================================================
      - name: Encontrar ZIP
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          find . -maxdepth 3 -type f -print

          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERRO: nenhum arquivo ZIP foi encontrado."
            exit 1
          fi

          echo ""
          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. EXTRAIR ZIP
      # =========================================================
      - name: Extrair ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_PATH" -d extracted

          echo ""
          echo "Conteúdo do ZIP:"
          find extracted -maxdepth 5 -type f -print


      # =========================================================
      # 6. ENCONTRAR INDEX.HTML
      # =========================================================
      - name: Encontrar aplicativo
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "index.html encontrado:"
          echo "$INDEX"

          APP_DIR=$(dirname "$INDEX")

          echo "Pasta do aplicativo:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 7. CRIAR PROJETO WEB
      # =========================================================
      - name: Preparar arquivos do aplicativo
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project/www

          echo "Copiando arquivos..."

          cp -R "$APP_DIR"/. project/www/

          echo ""
          echo "Arquivos dentro de www:"
          find project/www -maxdepth 5 -type f -print


      # =========================================================
      # 8. VERIFICAR INDEX
      # =========================================================
      - name: Verificar index.html
        shell: bash
        run: |
          set -e

          if [ ! -f "project/www/index.html" ]; then
            echo "ERRO: project/www/index.html não existe."
            exit 1
          fi

          echo "index.html encontrado."

          echo ""
          echo "Primeiras linhas:"
          head -n 80 project/www/index.html


      # =========================================================
      # 9. PACKAGE.JSON
      # =========================================================
      - name: Criar package.json
        working-directory: project
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "geoarvore",
            "version": "1.0.0",
            "description": "GeoÁrvore",
            "private": true,
            "scripts": {
              "build": "echo GeoÁrvore"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF


      # =========================================================
      # 10. INSTALAR CAPACITOR
      # =========================================================
      - name: Instalar dependências
        working-directory: project
        shell: bash
        run: |
          npm install


      # =========================================================
      # 11. CONFIGURAR CAPACITOR
      # =========================================================
      - name: Configurar Capacitor
        working-directory: project
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.geoarvore.app",
            "appName": "GeoÁrvore",
            "webDir": "www",
            "server": {
              "hostname": "localhost",
              "androidScheme": "https"
            }
          }
          EOF

          echo "capacitor.config.json:"
          cat capacitor.config.json


      # =========================================================
      # 12. CRIAR ANDROID
      # =========================================================
      - name: Criar projeto Android
        working-directory: project
        shell: bash
        run: |
          npx cap add android


      # =========================================================
      # 13. COPIAR ARQUIVOS WEB
      # =========================================================
      - name: Sincronizar aplicativo
        working-directory: project
        shell: bash
        run: |
          npx cap sync android


      # =========================================================
      # 14. VERIFICAR SE O INDEX FOI PARA O APK
      # =========================================================
      - name: Verificar arquivos do APK
        working-directory: project
        shell: bash
        run: |
          set -e

          echo "Verificando arquivos..."

          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERRO: index.html não foi copiado para o Android."
            exit 1
          fi

          echo "OK: index.html encontrado."

          echo ""
          echo "Arquivos:"
          find android/app/src/main/assets/public -maxdepth 5 -type f -print


      # =========================================================
      # 15. CONFIGURAR PERMISSÕES
      # =========================================================
      - name: Configurar permissões Android
        working-directory: project
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          tree = ET.parse(manifest)
          root = tree.getroot()

          android_ns = "http://schemas.android.com/apk/res/android"

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          existing = set()

          for element in root.findall("uses-permission"):
              value = element.get(f"{{{android_ns}}}name")
              if value:
                  existing.add(value)

          for permission in permissions:
              if permission not in existing:
                  element = ET.Element("uses-permission")
                  element.set(f"{{{android_ns}}}name", permission)
                  root.insert(0, element)

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("AndroidManifest configurado.")
          PY

          echo ""
          echo "Manifest:"
          cat android/app/src/main/AndroidManifest.xml


      # =========================================================
      # 16. GARANTIR ACESSO À INTERNET
      # =========================================================
      - name: Configurar WebView
        working-directory: project
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text(encoding="utf-8")

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(text, encoding="utf-8")

          print("WebView configurado.")
          PY


      # =========================================================
      # 17. COPIAR ÍCONE
      # =========================================================
      - name: Preparar ícone
        working-directory: project
        shell: bash
        run: |
          if [ -f "www/planta-cobra.png" ]; then

            echo "Ícone encontrado."

            mkdir -p android/app/src/main/res/drawable

            cp "www/planta-cobra.png" \
              "android/app/src/main/res/drawable/geoarvore_icon.png"

          else

            echo "Ícone personalizado não encontrado."
            echo "Continuando com o ícone padrão."

          fi


      # =========================================================
      # 18. MOSTRAR ESTRUTURA ANDROID
      # =========================================================
      - name: Diagnóstico final
        working-directory: project
        shell: bash
        run: |
          echo "========== WWW =========="
          find www -maxdepth 4 -type f -print

          echo ""
          echo "========== INDEX =========="
          wc -c www/index.html

          echo ""
          echo "========== SCRIPTS =========="
          grep -nE '<script|src=|href=' www/index.html || true

          echo ""
          echo "========== ANDROID PUBLIC =========="
          find android/app/src/main/assets/public -maxdepth 4 -type f -print

          echo ""
          echo "========== MANIFEST =========="
          cat android/app/src/main/AndroidManifest.xml


      # =========================================================
      # 19. LIMPAR GRADLE
      # =========================================================
      - name: Limpar Android
        working-directory: project/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean


      # =========================================================
      # 20. COMPILAR APK
      # =========================================================
      - name: Construir APK
        working-directory: project/android
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace


      # =========================================================
      # 21. ENCONTRAR APK
      # =========================================================
      - name: Encontrar APK
        shell: bash
        run: |
          echo "APKs gerados:"

          find project/android \
            -type f \
            -name "*.apk" \
            -print


      # =========================================================
      # 22. DISPONIBILIZAR APK
      # =========================================================
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoArvore-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
